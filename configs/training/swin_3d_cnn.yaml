model:
  name: swin_3d_cnn
  num_classes: 5
  in_channels: 1

training:
  batch_size: 8
  epochs: 50
  save_path: 'checkpoints/swin_3d_cnn/swin_3d_cnn_best.pth'
  optimizer:
    name: 'adam'
    weight_decay: 1e-4
    lr: 1e-4
  early_stopping:
    monitor: 'val_loss'
    patience: 10
  loss:
    name: 'CrossEntropyLoss'

data:
  train_csv: 'configs/split_results/train_split_70.csv'
  val_csv: 'configs/split_results/val_split_10.csv'
  test_csv: 'configs/split_results/test_split_20.csv'
  data_root_dir: 'dataset/ADNI/ADNI'
